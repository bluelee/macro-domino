name: 매크로 데이터 자동 수집

on:
  schedule:
    - cron: '0 * * * *'  # UTC 매시 정각 (KST 매시 9분)
  workflow_dispatch:       # GitHub Actions 탭에서 수동 실행 가능

permissions:
  contents: write          # git push 권한 (workflow 레벨 선언)

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    continue-on-error: true  # 실패해도 다음 실행에 영향 없음

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 실행
        run: python fetch_macro_data.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 변경사항 확인 후 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_data.json
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            git commit -m "데이터 업데이트 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
