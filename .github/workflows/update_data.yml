name: 매크로 데이터 자동 수집

on:
  schedule:
    - cron: '0 * * * *'   # 매시 정각 (UTC) — 한국시간 매시 9분
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    continue-on-error: true   # 실패해도 다음 실행에 영향 없음

    permissions:
      contents: write         # git push 권한

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install yfinance requests

      - name: 데이터 수집 실행
        run: python fetch_macro_data.py
        env:
          # GitHub Actions에서는 ECOS API 외부 접근 불가 → fallback 3.5% 자동 사용
          PYTHONIOENCODING: utf-8

      - name: 변경사항 확인 후 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_data.json
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            git commit -m "데이터 업데이트 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
